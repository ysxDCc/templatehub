<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="-4 -4 48 48" fill="none">
<style>
.tile,.f,.word{transform-box:fill-box;transform-origin:center}
.tile{animation:tile .5s cubic-bezier(.2,.8,.2,1) both}
.top{animation:top .7s cubic-bezier(.34,1.4,.5,1) .12s both, breatheT 4s ease-in-out 1.6s infinite}
.left{animation:left .7s cubic-bezier(.34,1.4,.5,1) .22s both, breatheL 4s ease-in-out 1.6s infinite}
.right{animation:right .7s cubic-bezier(.34,1.4,.5,1) .32s both, breatheR 4s ease-in-out 1.6s infinite}
.shine{animation:shine 4s ease-in-out .95s infinite}
@keyframes tile{from{opacity:0;transform:scale(.6) rotate(-12deg)}to{opacity:1;transform:none}}
@keyframes top{from{opacity:0;transform:translateY(-14px) scale(.8)}to{opacity:1;transform:none}}
@keyframes left{from{opacity:0;transform:translate(-12px,9px) scale(.8)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translate(12px,9px) scale(.8)}to{opacity:1;transform:none}}
@keyframes breatheT{0%,70%,100%{transform:none}80%{transform:translateY(-1.6px)}}
@keyframes breatheL{0%,70%,100%{transform:none}80%{transform:translate(-1.4px,.9px)}}
@keyframes breatheR{0%,70%,100%{transform:none}80%{transform:translate(1.4px,.9px)}}
@keyframes shine{0%{opacity:0;transform:skewX(-20deg) translateX(0)}5%{opacity:1}25%,100%{opacity:0;transform:skewX(-20deg) translateX(58px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="a" x1="6" y1="6" x2="34" y2="34" gradientUnits="userSpaceOnUse"><stop stop-color="#C4B5FD"/><stop offset="1" stop-color="#7C3AED"/></linearGradient><linearGradient id="b" x1="34" y1="8" x2="8" y2="34" gradientUnits="userSpaceOnUse"><stop stop-color="#A78BFA"/><stop offset="1" stop-color="#4C1D95"/></linearGradient><linearGradient id="s" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="c"><path d="M20 8 31 14.5v12L20 33 9 26.5v-12Z"/></clipPath></defs><rect class="tile" x="1" y="1" width="38" height="38" rx="11" fill="#110A2B" stroke="#C4B5FD" stroke-opacity=".35"/><path class="f top" d="M20 8 31 14.5 20 21 9 14.5Z" fill="url(#a)"/><path class="f left" d="M9 14.5 20 21v12L9 26.5Z" fill="url(#b)"/><path class="f right" d="M20 21 31 14.5v12L20 33Z" fill="#7C3AED"/><g clip-path="url(#c)"><rect class="shine" x="-14" y="4" width="10" height="34" fill="url(#s)"/></g>
</svg>
